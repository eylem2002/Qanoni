openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contracts
    description: Arabic legal contract generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contracts/generate:
    post:
      operationId: generateContract
      tags: [contracts]
      summary: Generate an Arabic employment contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractInput"
      responses:
        "200":
          description: Generated contract text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Validation error - generated contract failed legal checks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractValidationError"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ContractInput:
      type: object
      properties:
        employerName:
          type: string
        employeeName:
          type: string
        jobTitle:
          type: string
        monthlySalary:
          type: number
        startDate:
          type: string
        employmentType:
          type: string
        probationPeriodDays:
          type: number
          description: Probation period in days (30, 60, or 90)
        annualLeaveDays:
          type: number
          description: Annual leave days (14 minimum per Jordanian law)
        hasBonus:
          type: boolean
          description: Whether employee is eligible for performance bonuses
        hasOvertime:
          type: boolean
          description: Whether overtime applies per Jordanian Labor Law
        specialConditions:
          type: string
          description: Any additional special conditions or clauses
      required:
        - employerName
        - employeeName
        - jobTitle
        - monthlySalary
        - startDate
        - employmentType
        - probationPeriodDays
        - annualLeaveDays
        - hasBonus
        - hasOvertime
    ContractResult:
      type: object
      properties:
        contract:
          type: string
        validationWarnings:
          type: array
          items:
            type: string
          description: Non-fatal warnings from the legal validation layer
      required:
        - contract
        - validationWarnings
    ContractValidationError:
      type: object
      properties:
        error:
          type: string
        missingClauses:
          type: array
          items:
            type: string
      required:
        - error
        - missingClauses
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
