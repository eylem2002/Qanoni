openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contracts
    description: Arabic legal contract generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contracts/generate:
    post:
      operationId: generateContract
      tags: [contracts]
      summary: Generate an Arabic employment contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractInput"
      responses:
        "200":
          description: Generated contract text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Validation error - generated contract failed legal checks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractValidationError"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ContractInput:
      type: object
      properties:
        employerName:
          type: string
          description: اسم صاحب العمل
        employerRegistrationNumber:
          type: string
          description: رقم التسجيل التجاري لصاحب العمل (اختياري)
        employeeName:
          type: string
          description: اسم الموظف
        employeeId:
          type: string
          description: رقم الهوية الوطنية أو جواز السفر للموظف
        jobTitle:
          type: string
          description: المسمى الوظيفي
        department:
          type: string
          description: القسم أو الإدارة (اختياري)
        directManager:
          type: string
          description: اسم المشرف المباشر (اختياري)
        monthlySalary:
          type: number
          description: الراتب الشهري بالدينار الأردني
        startDate:
          type: string
          description: تاريخ بدء العمل
        employmentType:
          type: string
          description: نوع عقد العمل
        probationPeriodDays:
          type: number
          description: فترة التجربة بالأيام (0 أو 30 أو 60 أو 90 كحد أقصى)
        noticePeriod:
          type: string
          description: فترة الإشعار المطلوبة لإنهاء العقد
        annualLeaveDays:
          type: number
          description: أيام الإجازة السنوية (14 كحد أدنى قانوني)
        hasBonus:
          type: boolean
          description: هل يستحق الموظف مكافأة أداء سنوية
        hasOvertime:
          type: boolean
          description: هل ينطبق نظام العمل الإضافي
        benefits:
          type: array
          items:
            type: string
          description: قائمة المزايا والتأمينات المشمولة في العقد
        hasConfidentialityClause:
          type: boolean
          description: هل يتضمن العقد بند السرية وحفظ أسرار العمل
        ipRights:
          type: string
          description: ملكية حقوق الملكية الفكرية للأعمال المنجزة
        workLocation:
          type: string
          description: مكان أو نمط العمل (حضوري، عن بعد، هجين)
        specialConditions:
          type: string
          description: أي بنود أو شروط خاصة إضافية
      required:
        - employerName
        - employeeName
        - employeeId
        - jobTitle
        - monthlySalary
        - startDate
        - employmentType
        - probationPeriodDays
        - noticePeriod
        - annualLeaveDays
        - hasBonus
        - hasOvertime
        - hasConfidentialityClause
    ContractResult:
      type: object
      properties:
        contract:
          type: string
        validationWarnings:
          type: array
          items:
            type: string
          description: Non-fatal warnings from the legal validation layer
      required:
        - contract
        - validationWarnings
    ContractValidationError:
      type: object
      properties:
        error:
          type: string
        missingClauses:
          type: array
          items:
            type: string
      required:
        - error
        - missingClauses
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
