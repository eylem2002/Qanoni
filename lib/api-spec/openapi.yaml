openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contracts
    description: Arabic legal contract generation
  - name: auth
    description: Account authentication (session cookie)
  - name: admin
    description: Admin operations (law change notifications, cache management)
paths:
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create an account and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Account created; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Destroy the current session
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Return the authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /contracts:
    get:
      operationId: listContracts
      tags: [contracts]
      summary: List the authenticated user's saved contracts
      responses:
        "200":
          description: Saved contract summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractListResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /contracts/{id}:
    get:
      operationId: getContract
      tags: [contracts]
      summary: Retrieve one saved contract owned by the user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedContractResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /reviews:
    get:
      operationId: listReviews
      tags: [contracts]
      summary: List the authenticated user's saved reviews
      responses:
        "200":
          description: Saved review summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /reviews/{id}:
    get:
      operationId: getReview
      tags: [contracts]
      summary: Retrieve one saved review owned by the user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedReviewResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/law-changes:
    get:
      operationId: listLawChanges
      tags: [admin]
      summary: List unacknowledged law version change notifications
      description: Returns all law_notifications rows that have not yet been acknowledged, plus current in-memory cache stats.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Unacknowledged law change notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LawChangesResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/law-changes/acknowledged:
    post:
      operationId: acknowledgeLawChanges
      tags: [admin]
      summary: Acknowledge law change notifications and invalidate the RAG cache
      description: |
        Marks law change notifications as acknowledged and clears the corresponding
        in-memory RAG cache entries so the next contract generation fetches fresh
        law text from the RAG service.
      security:
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                contractType:
                  type: string
                  description: If provided, acknowledges only this contract type; otherwise acknowledges all.
      responses:
        "200":
          description: Acknowledged and cache invalidated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcknowledgeResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contracts/generate:
    post:
      operationId: generateContract
      tags: [contracts]
      summary: Generate an Arabic employment contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractInput"
      responses:
        "200":
          description: Generated contract text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Validation error - generated contract failed legal checks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractValidationError"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ContractInput:
      type: object
      properties:
        employerName:
          type: string
          description: اسم صاحب العمل
        employerRegistrationNumber:
          type: string
          description: رقم التسجيل التجاري لصاحب العمل (اختياري)
        employeeName:
          type: string
          description: اسم الموظف
        employeeId:
          type: string
          description: رقم الهوية الوطنية أو جواز السفر للموظف
        jobTitle:
          type: string
          description: المسمى الوظيفي
        department:
          type: string
          description: القسم أو الإدارة (اختياري)
        directManager:
          type: string
          description: اسم المشرف المباشر (اختياري)
        monthlySalary:
          type: number
          description: الراتب الشهري بالدينار الأردني
        startDate:
          type: string
          description: تاريخ بدء العمل
        employmentType:
          type: string
          description: نوع عقد العمل
        probationPeriodDays:
          type: number
          description: فترة التجربة بالأيام (0 أو 30 أو 60 أو 90 كحد أقصى)
        noticePeriod:
          type: string
          description: فترة الإشعار المطلوبة لإنهاء العقد
        annualLeaveDays:
          type: number
          description: أيام الإجازة السنوية (14 كحد أدنى قانوني)
        hasBonus:
          type: boolean
          description: هل يستحق الموظف مكافأة أداء سنوية
        hasOvertime:
          type: boolean
          description: هل ينطبق نظام العمل الإضافي
        benefits:
          type: array
          items:
            type: string
          description: قائمة المزايا والتأمينات المشمولة في العقد
        hasConfidentialityClause:
          type: boolean
          description: هل يتضمن العقد بند السرية وحفظ أسرار العمل
        ipRights:
          type: string
          description: ملكية حقوق الملكية الفكرية للأعمال المنجزة
        workLocation:
          type: string
          description: مكان أو نمط العمل (حضوري، عن بعد، هجين)
        specialConditions:
          type: string
          description: أي بنود أو شروط خاصة إضافية
      required:
        - employerName
        - employeeName
        - employeeId
        - jobTitle
        - monthlySalary
        - startDate
        - employmentType
        - probationPeriodDays
        - noticePeriod
        - annualLeaveDays
        - hasBonus
        - hasOvertime
        - hasConfidentialityClause
    ContractResult:
      type: object
      properties:
        contract:
          type: string
        validationWarnings:
          type: array
          items:
            type: string
          description: Non-fatal warnings from the legal validation layer
      required:
        - contract
        - validationWarnings
    ContractValidationError:
      type: object
      properties:
        error:
          type: string
        missingClauses:
          type: array
          items:
            type: string
      required:
        - error
        - missingClauses
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    SignupInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        firmName:
          type: string
      required:
        - email
        - password
    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firmName:
          type: string
          nullable: true
      required:
        - id
        - email
    AuthResult:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
      required:
        - user
    ContractSummary:
      type: object
      properties:
        id:
          type: string
        contractType:
          type: string
        createdAt:
          type: string
      required:
        - id
        - contractType
        - createdAt
    ContractListResult:
      type: object
      properties:
        contracts:
          type: array
          items:
            $ref: "#/components/schemas/ContractSummary"
      required:
        - contracts
    SavedContract:
      type: object
      properties:
        id:
          type: string
        contractType:
          type: string
        generatedText:
          type: string
        createdAt:
          type: string
      required:
        - id
        - contractType
        - generatedText
        - createdAt
    SavedContractResult:
      type: object
      properties:
        contract:
          $ref: "#/components/schemas/SavedContract"
        stale:
          type: boolean
          description: True when the law versions used at generation time differ from the currently known versions
        changedLaws:
          type: array
          items:
            type: string
          description: Law version IDs that are new since the contract was generated (only populated when stale=true)
      required:
        - contract
        - stale
        - changedLaws
    LawNotification:
      type: object
      properties:
        id:
          type: string
        contractType:
          type: string
        previousVersionIds:
          type: array
          items:
            type: string
        newVersionIds:
          type: array
          items:
            type: string
        detectedAt:
          type: string
        acknowledgedAt:
          type: string
          nullable: true
      required:
        - id
        - contractType
        - previousVersionIds
        - newVersionIds
        - detectedAt
    CacheStats:
      type: object
      additionalProperties:
        type: object
        properties:
          expiresAt:
            type: number
          fresh:
            type: boolean
    LawChangesResult:
      type: object
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/LawNotification"
        cacheStats:
          $ref: "#/components/schemas/CacheStats"
      required:
        - changes
        - cacheStats
    AcknowledgeResult:
      type: object
      properties:
        acknowledged:
          type: boolean
        cacheStats:
          $ref: "#/components/schemas/CacheStats"
      required:
        - acknowledged
        - cacheStats
    ReviewSummary:
      type: object
      properties:
        id:
          type: string
        filename:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - createdAt
    ReviewListResult:
      type: object
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/ReviewSummary"
      required:
        - reviews
    SavedReview:
      type: object
      properties:
        id:
          type: string
        filename:
          type: string
          nullable: true
        findings:
          type: array
          items:
            type: object
            additionalProperties: true
        createdAt:
          type: string
      required:
        - id
        - findings
        - createdAt
    SavedReviewResult:
      type: object
      properties:
        review:
          $ref: "#/components/schemas/SavedReview"
      required:
        - review
